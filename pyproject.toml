[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diagrid"
version = "0.4.2"
description = "Diagrid namespace package"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dapr>=1.17.3",
    "dapr-ext-workflow>=1.17.3",
    "diagrid-cli>=0.1.0",
]

[project.scripts]
diagridpy = "diagrid.cli.main:cli"

[project.optional-dependencies]
agent-core = [
    # Pinned to 1.0.1: 1.0.2 added `mistralai>=2.2.0` as a direct dep,
    # which pins `opentelemetry-semantic-conventions>=0.60b1,<0.61` — that
    # range overlaps with no opentelemetry-sdk version google-adk accepts
    # (sdk 1.36–1.41.1 each pin semconv to a different exact version,
    # none of which is 0.60b1). 1.0.1 has no mistralai and resolves cleanly.
    "dapr-agents==1.0.1",
    "dapr-ext-langgraph>=1.17.3",
    "dapr-ext-strands>=1.17.3",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "pydantic>=2.12.5,<2.14",
    "langgraph>=1.1.10",
]
langgraph = [
    "langgraph>=1.1.10",
    "langchain-core>=1.3.2",
    "diagrid[agent-core]",
]
crewai = [
    # crewai>=1.10 pins `opentelemetry-api~=1.34.0` (i.e. <1.35), which is
    # unsatisfiable with dapr-agents>=1.0.1's `>=1.35.0` floor. Capping at
    # <1.10 until crewai relaxes their pin upstream.
    "crewai>=1.6.1,<1.15",
    "litellm>=1.0.0,!=1.82.7,!=1.82.8",
    "diagrid[agent-core]",
]
adk = [
    "google-adk>=1.32.0,<3",
    "diagrid[agent-core]",
]
strands = [
    "openai>=2.33.0",
    "strands-agents>=1.38.0",
    "diagrid[agent-core]",
]
openai_agents = [
    "openai-agents>=0.15.1",
    "openai>=2.33.0",
    "diagrid[agent-core]",
]
claude_agents = [
    "claude-agent-sdk>=0.1.45",
    "anthropic>=0.40.0",
    "diagrid[agent-core]",
]
pydantic_ai = [
    # Use pydantic-ai-slim with selected extras instead of the `pydantic-ai`
    # meta-package, which pulls in `pydantic-ai-slim[mistral,logfire,...]`
    # — `mistral` brings mistralai 2.x (semconv 0.60b1 pin) and `logfire`
    # brings opentelemetry-sdk; together those are unsatisfiable with each
    # other's OTel constraints.
    "pydantic-ai-slim[openai]>=1.89.1",
    "diagrid[agent-core]",
]
deepagents = [
    "deepagents>=0.5.6",
    "diagrid[langgraph]",
    "langchain-openai>=1.2.1",
]
# NOTE: holmesgpt is intentionally NOT in the ``all`` meta-extra below.
# HolmesGPT pins many of its transitive deps tightly (fastapi <0.122,
# uvicorn <0.41, cachetools <6, mcp ==1.25, httpx[socks] <0.28, …) which
# fight with the looser constraints used by the other agent frameworks.
# Install via ``pip install diagrid[holmesgpt]`` in a dedicated environment.
holmesgpt = [
    "holmesgpt>=0.26.0",
    "diagrid[agent-core]",
]
all = [
    "diagrid[langgraph,crewai,adk,strands,openai_agents,pydantic_ai,deepagents,claude_agents]",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<3.0.0",
    "pip-tools>=7.4.1,<8.0.0",
    "cachetools>=6.1.0,<8.0.0",
    "flake8>=7.3.0",
    "ruff>=0.14.11",
    "pre-commit>=4.0.0,<5.0.0",
]
test = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests requiring real network access or live infra (excluded from default run)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["diagrid*"]
exclude = [
    "diagrid.core*",
    "diagrid.cli*",
]

[tool.setuptools.package-data]
diagrid = ["py.typed"]

[tool.uv]
exclude-newer = "1 days"
# Allow pre-release packages when required by a dependency. HolmesGPT pulls
# in ``azure-mgmt-sql>=4.0.0b21`` (the 4.x line is still in beta on PyPI);
# without this setting uv refuses to resolve the workspace lock.
prerelease = "if-necessary-or-explicit"
# crewai pins `opentelemetry-api~=1.34.0`, but dapr-agents requires
# `>=1.35.0`. OpenTelemetry 1.x is backwards compatible, so override
# crewai's tight pin so both resolve against the same line.
override-dependencies = [
    "opentelemetry-api>=1.35.0,<2.0.0",
    "opentelemetry-sdk>=1.35.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0,<2.0.0",
    # holmesgpt pins fastapi ``^0.121.1`` and uvicorn ``^0.40`` which collide
    # with diagrid[agent-core]'s ``>=0.129.0`` and ``>=0.41.0`` floors. Both
    # deltas are backwards-compatible for the surface holmesgpt uses (only
    # its HTTP server, which we don't re-expose).
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    # holmesgpt pins cachetools ``^5.5.0`` while diagrid's dev group floors
    # at ``>=6.1.0``.
    "cachetools>=6.1.0,<8.0.0",
    # holmesgpt pins ``mcp==1.25.0`` while dapr-agents==1.0.1 requires
    # ``mcp>=1.26.0``. mcp 1.26 adds APIs over 1.25 and is wire-compatible
    # for the surfaces both libraries use.
    "mcp==1.26.0",
    # Cap numpy below the 2.5.x line — 2.5.0rc1's stubs use PEP 695
    # ``type X = ...`` syntax (Python 3.12+), which trips mypy's
    # ``python_version = 3.11`` target with ``Type statement is only
    # supported in Python 3.12 and greater``. Stay on the 2.4.x stable line.
    "numpy<2.5",
]

# HolmesGPT ships strict pins on fastapi, uvicorn, cachetools, mcp, and
# httpx[socks] that conflict with the constraints used by the other agent
# framework extras. Declare them as conflicting so uv resolves the
# holmesgpt extra into a separate fork of the lock — keeping the main
# resolution unaffected.
conflicts = [
    [
        { extra = "holmesgpt" },
        { extra = "langgraph" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "crewai" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "adk" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "strands" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "openai_agents" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "pydantic_ai" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "deepagents" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "claude_agents" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "all" },
    ],
]

[tool.uv.workspace]
members = [
    "diagrid/core",
    "diagrid/cli",
    "examples/langgraph",
    "examples/crewai",
    "examples/openai_agents",
    "examples/pydantic_ai",
    "examples/adk",
    "examples/strands",
    "examples/deepagents",
    "examples/claude_agents",
    # HolmesGPT examples deliberately NOT a workspace member — see the note
    # next to the ``holmesgpt`` extra above. The example scripts still run
    # standalone via ``dapr run -- python examples/holmesgpt/...``.
]

[tool.uv.sources]
diagrid = { workspace = true }
diagrid-core = { workspace = true }
diagrid-cli = { workspace = true }
