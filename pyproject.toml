[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diagrid"
version = "0.5.3"
description = "Diagrid namespace package"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dapr>=1.17.3",
    "dapr-ext-workflow>=1.17.3",
    "diagrid-cli>=0.1.0",
]

[project.scripts]
diagridpy = "diagrid.cli.main:cli"

[project.optional-dependencies]
agent-core = [
    # Releases 1.0.2–1.0.5 cap `opentelemetry-semantic-conventions<0.61`
    # (directly, and via `mistralai>=2.2.0`), which holds the whole OTel
    # stack on the 1.39.x line. dapr-agents main lifted that cap
    # (dapr/dapr-agents#780, `mistralai>=2.9.2`); 1.0.1 predates the cap.
    # TEMPORARY: tracking dapr-agents main for the lifecycle-dispatcher and
    # hooks modules until it cuts a release that includes them. Revert to a
    # pinned release that includes dapr/dapr-agents#780 (not 1.0.2–1.0.5)
    # before merge.
    "dapr-agents",
    "dapr-ext-langgraph>=1.17.3",
    "dapr-ext-strands>=1.17.3",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "pydantic>=2.12.5,<2.14",
    "langgraph>=1.1.10",
]
langgraph = [
    "langgraph>=1.1.10",
    "langchain-core>=1.3.2",
    "diagrid[agent-core]",
]
crewai = [
    # crewai>=1.15.4 requires `mcp~=1.28.1`, but the `mcp==1.26.0` override
    # (see [tool.uv]) forces 1.26.0 and silently hides that clash. 1.15.3 is
    # the newest release that accepts both `mcp~=1.26.0` and the
    # `opentelemetry-api~=1.42.0` line the rest of the graph resolves. Raise
    # this bound only together with the mcp override.
    "crewai>=1.6.1,<1.15.4",
    "litellm>=1.0.0,!=1.82.7,!=1.82.8",
    "diagrid[agent-core]",
]
adk = [
    "google-adk>=1.32.0,<3",
    "diagrid[agent-core]",
]
strands = [
    "openai>=2.33.0",
    "strands-agents>=1.38.0",
    "diagrid[agent-core]",
]
openai_agents = [
    "openai-agents>=0.15.1",
    "openai>=2.33.0",
    "diagrid[agent-core]",
]
claude_agents = [
    "claude-agent-sdk>=0.1.45",
    "anthropic>=0.40.0",
    "diagrid[agent-core]",
]
pydantic_ai = [
    # Use pydantic-ai-slim with selected extras instead of the `pydantic-ai`
    # meta-package, which pulls in `pydantic-ai-slim[mistral,logfire,...]`
    # — `mistral` brings mistralai 2.x (releases before 2.9.2 cap OTel
    # semconv) and `logfire` brings opentelemetry-sdk; together those have
    # been unsatisfiable with each other's OTel constraints.
    "pydantic-ai-slim[openai]>=1.89.1",
    "diagrid[agent-core]",
]
deepagents = [
    "deepagents>=0.5.6",
    "diagrid[langgraph]",
    "langchain-openai>=1.2.1",
]
langchain = [
    "langchain-core>=1.3.2",
    "langchain-openai>=1.2.1",
    "diagrid[agent-core]",
]
smolagents = [
    "smolagents>=1.26.0",
    "diagrid[agent-core]",
]
# Runtime deps of ``diagrid.identity``, kept out of the base dependency list
# so a plain ``pip install diagrid`` stays lean. Nothing in the base deps
# pulls starlette, so without this extra ``asgi.py`` does not import at all.
# httpx2 is a separate distribution from httpx and installs alongside it, so
# it cannot collide with the ``httpx[socks] <0.28`` pin holmesgpt brings.
# starlette stays on the 1.x line the rest of the graph already resolves —
# a higher floor forces a repo-wide upgrade, and asgi.py only needs
# BaseHTTPMiddleware, Request and JSONResponse.
identity = [
    # ``crypto`` is required, not optional: plain pyjwt ships no asymmetric
    # backend and ``verifier.py`` decodes RS256/ES256.
    "pyjwt[crypto]>=2.13",
    "httpx2>=2.12",
    "starlette>=1.3",
]
# NOTE: holmesgpt is intentionally NOT in the ``all`` meta-extra below.
# HolmesGPT pins many of its transitive deps tightly (fastapi <0.122,
# uvicorn <0.41, cachetools <6, mcp ==1.25, httpx[socks] <0.28, …) which
# fight with the looser constraints used by the other agent frameworks.
# Install via ``pip install diagrid[holmesgpt]`` in a dedicated environment.
holmesgpt = [
    "holmesgpt>=0.26.0",
    # ``runner.build_fastapi_app`` installs ``OAuthMiddleware``.
    "diagrid[agent-core,identity]",
]
all = [
    "diagrid[langgraph,crewai,adk,strands,openai_agents,pydantic_ai,deepagents,claude_agents,langchain,smolagents,identity]",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<3.0.0",
    "pip-tools>=7.4.1,<8.0.0",
    "cachetools>=6.1.0,<8.0.0",
    "flake8>=7.3.0",
    "ruff>=0.14.11",
    "pre-commit>=4.0.0,<5.0.0",
]
test = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests requiring real network access or live infra (excluded from default run)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["diagrid*"]
exclude = [
    "diagrid.core*",
    "diagrid.cli*",
]

[tool.setuptools.package-data]
diagrid = ["py.typed"]

[tool.uv]
exclude-newer = "1 days"
# Allow pre-release packages when required by a dependency. HolmesGPT pulls
# in ``azure-mgmt-sql>=4.0.0b21`` (the 4.x line is still in beta on PyPI);
# without this setting uv refuses to resolve the workspace lock.
prerelease = "if-necessary-or-explicit"
override-dependencies = [
    # holmesgpt pins fastapi ``^0.121.1`` and uvicorn ``^0.40`` which collide
    # with diagrid[agent-core]'s ``>=0.129.0`` and ``>=0.41.0`` floors. Both
    # deltas are backwards-compatible for the surface holmesgpt uses (only
    # its HTTP server, which we don't re-expose).
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    # holmesgpt pins cachetools ``^5.5.0`` while diagrid's dev group floors
    # at ``>=6.1.0``.
    "cachetools>=6.1.0,<8.0.0",
    # holmesgpt pins ``mcp==1.25.0`` while dapr-agents==1.0.1 requires
    # ``mcp>=1.26.0``. mcp 1.26 adds APIs over 1.25 and is wire-compatible
    # for the surfaces both libraries use.
    "mcp==1.26.0",
    # Cap numpy below the 2.5.x line — 2.5.0rc1's stubs use PEP 695
    # ``type X = ...`` syntax (Python 3.12+), which trips mypy's
    # ``python_version = 3.11`` target with ``Type statement is only
    # supported in Python 3.12 and greater``. Stay on the 2.4.x stable line.
    "numpy<2.5",
]

# HolmesGPT ships strict pins on fastapi, uvicorn, cachetools, mcp, and
# httpx[socks] that conflict with the constraints used by the other agent
# framework extras. Declare them as conflicting so uv resolves the
# holmesgpt extra into a separate fork of the lock — keeping the main
# resolution unaffected.
conflicts = [
    [
        { extra = "holmesgpt" },
        { extra = "langgraph" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "crewai" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "adk" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "strands" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "openai_agents" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "pydantic_ai" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "deepagents" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "claude_agents" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "langchain" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "smolagents" },
    ],
    [
        { extra = "holmesgpt" },
        { extra = "all" },
    ],
]

[tool.uv.workspace]
members = [
    "diagrid/core",
    "diagrid/cli",
    "examples/langgraph",
    "examples/crewai",
    "examples/openai_agents",
    "examples/pydantic_ai",
    "examples/adk",
    "examples/strands",
    "examples/deepagents",
    "examples/claude_agents",
    "examples/langchain",
    "examples/smolagents",
    # examples/identity is deliberately NOT a workspace member. Registering it
    # forks resolution across every extra, which grows uv.lock by ~6000 lines of
    # resolution markers. Its dependencies come from the root `identity` extra,
    # which is what its README tells you to install.
    # HolmesGPT examples deliberately NOT a workspace member — see the note
    # next to the ``holmesgpt`` extra above. The example scripts still run
    # standalone via ``dapr run -- python examples/holmesgpt/...``.
]

[tool.uv.sources]
diagrid = { workspace = true }
diagrid-core = { workspace = true }
diagrid-cli = { workspace = true }
# TEMPORARY: see note next to the dapr-agents dependency above.
dapr-agents = { git = "https://github.com/dapr/dapr-agents", branch = "main" }
