name: Helm CI

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/catalyst-agents/**"
      - "charts-tests/**"
      - ".github/workflows/helm-ci.yaml"
  push:
    branches: [main]
    paths:
      - "charts/catalyst-agents/**"
      - "charts-tests/**"
      - ".github/workflows/helm-ci.yaml"

permissions:
  contents: read

env:
  HELM_VERSION: "3.17.0"
  CHAINSAW_VERSION: "v0.2.12"
  KUBECONFORM_VERSION: "v0.6.7"

jobs:
  lint-and-validate:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          BASE="https://github.com/yannh/kubeconform"
          V="${{ env.KUBECONFORM_VERSION }}"
          curl -sSLo kubeconform.tar.gz \
            "$BASE/releases/download/$V/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Helm dependency update
        run: helm dependency update ./charts/catalyst-agents

      - name: Assert the chaos-mesh CRD version matches the subchart
        # values.yaml's chaos.chartVersion drives `helm pull chaos-mesh --version
        # <it>` in templates/chaos-mesh-crds/job.yaml, while the subchart itself
        # is pinned in Chart.yaml. Nothing coupled the two, so they had already
        # drifted to 2.7.3 CRDs against a 2.8.3 controller. Dependabot updates
        # Chart.yaml and Chart.lock and never values.yaml, so this step is what
        # turns its next bump into a visible failure instead of a silent skew.
        run: |
          set -euo pipefail
          chart=$(yq '.dependencies[] | select(.name == "chaos-mesh") | .version' \
            charts/catalyst-agents/Chart.yaml)
          values=$(yq '.chaos.chartVersion' charts/catalyst-agents/values.yaml)
          echo "Chart.yaml chaos-mesh dependency: $chart"
          echo "values.yaml chaos.chartVersion:   $values"
          if [ "$chart" != "$values" ]; then
            echo "::error::chaos-mesh version skew: Chart.yaml says $chart, values.yaml chaos.chartVersion says $values. The CRD job pulls the values.yaml version while the subchart installs the Chart.yaml one, so the CRDs would not match the controller. Update charts/catalyst-agents/values.yaml."
            exit 1
          fi
          echo "CRD version matches the subchart."

      - name: Helm lint (full)
        run: make helm-test-lint

      - name: Template validation (minimal - own templates only)
        run: make helm-test-template

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Chainsaw
        run: |
          BASE="https://github.com/kyverno/chainsaw"
          V="${{ env.CHAINSAW_VERSION }}"
          curl -sSLo chainsaw.tar.gz \
            "$BASE/releases/download/$V/chainsaw_linux_amd64.tar.gz"
          tar xzf chainsaw.tar.gz
          sudo mv chainsaw /usr/local/bin/

      - name: Install kubeconform
        run: |
          BASE="https://github.com/yannh/kubeconform"
          V="${{ env.KUBECONFORM_VERSION }}"
          curl -sSLo kubeconform.tar.gz \
            "$BASE/releases/download/$V/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Restore registry mirror cache
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/registry-mirror-cache
          key: mirror-cache-${{ hashFiles('charts/catalyst-agents/Chart.yaml', 'charts/catalyst-agents/values.yaml') }}
          restore-keys: mirror-cache-

      - name: Run integration tests
        run: make helm-test-chainsaw
